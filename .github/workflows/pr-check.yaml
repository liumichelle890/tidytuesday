name: PR Submission Check
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  check-submission:
    runs-on: ubuntu-latest
    steps:
    - name: Determine PR Number
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "PR_NUMBER=${{ github.event.inputs.pr_number }}" >> "$GITHUB_ENV"
        else
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
        fi
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG before checkout (source)"
        printf 'GERALT_DBG PR_NUMBER=%s\n' "${PR_NUMBER:-<unset>}"
        printf 'GERALT_DBG event_name=%s\n' "${GITHUB_EVENT_NAME:-<unset>}"
        printf 'GERALT_DBG repository=%s\n' "${GITHUB_REPOSITORY:-<unset>}"
        printf 'GERALT_DBG checkout_ref=%s\n' "refs/pull/${PR_NUMBER:-<unset>}/head"
      continue-on-error: true
    - name: Checkout PR Code
      uses: actions/checkout@v5.0.1
      with:
        ref: refs/pull/${{ env.PR_NUMBER }}/head
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - name: Install R dependencies
      run: |
        install.packages("pak")
        pak::pak(c(
          "cli",
          "fs",
          "glue",
          "httr",
          "knitr",
          "magick",
          "purrr",
          "readr",
          "stringr",
          "yaml"
        ))
      shell: Rscript {0}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG before sink (run_checks)"
        printf 'GERALT_DBG PR_NUMBER=%s\n' "${PR_NUMBER:-<unset>}"
        printf 'GERALT_DBG pwd=%s\n' "$(pwd)"
        if [ -f .github/scripts/check_curated.R ]; then
          echo "GERALT_DBG check_curated.R present (first 40 lines):"
          sed -n '1,40p' .github/scripts/check_curated.R 2>/dev/null || echo "GERALT_DBG read of check_curated.R failed"
        else
          echo "GERALT_DBG check_curated.R NOT found in workspace"
        fi
        if command -v Rscript >/dev/null 2>&1; then
          echo "GERALT_DBG Rscript available: $(command -v Rscript)"
        else
          echo "GERALT_DBG Rscript NOT available on PATH"
        fi
      continue-on-error: true
    - name: Run Submission Checks
      id: run_checks
      run: Rscript .github/scripts/check_curated.R
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to run checks for
        required: true
        type: number
  pull_request_target:
    paths:
    - data/curated/**
